# CodeRabbit configuration for WarpHold UI — https://docs.coderabbit.ai/reference/configuration
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!build/**"
    - "!**/*.woff2"
    - "!package-lock.json"
  path_instructions:
    - path: "src/**"
      instructions: >-
        React 19 + TypeScript UI for WarpHold; new code is TypeScript; keep upstream
        data-testid attributes.
chat:
  auto_reply: true
